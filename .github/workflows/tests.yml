name: tests

on:
  push:
    branches: [main]
  pull_request:

# Only superseded PR checks are disposable; keep main verification separate.
concurrency:
  group: builder-tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install nginx and unzip for native regressions
        run: sudo apt-get update -qq && sudo apt-get install -y nginx unzip
      - name: Python unit and E2E tests
        env:
          WAVEMESH_REQUIRE_NGINX_TESTS: "1"
        run: |
          set -Eeuo pipefail
          python3 -m compileall -q agent scripts tests
          for test in tests/unit/test_*.py; do
            python3 "$test"
          done
          python3 tests/e2e/test_multi_exit.py
      - name: Bash and adapter tests
        # Root ownership and permissions are part of the constrained pilot boundary.
        run: |
          set -Eeuo pipefail
          bash tests/unit/test_baseline.sh
          bash tests/unit/test_runtime_process.sh
          bash tests/unit/test_native_readiness.sh
          bash tests/unit/test_transaction.sh
          bash tests/integration/test_xui_api.sh
          bash tests/smoke/node_agent_unit_hardening.sh
          bash tests/smoke/node_agent_installer.sh
          bash tests/smoke/node_agent_rollback_latest.sh
          bash -n bin/wavemesh agent/*.sh scripts/commands/*.sh scripts/lib/*.sh
      - name: Native expiry pilot ownership and PKI proof
        run: |
          sudo python3 tests/unit/test_expired_node_pilot.py
          sudo python3 tests/unit/test_expired_pilot_installer.py
          sudo bash tests/unit/test_xui_artifact_custody.sh
      - name: Patch hygiene
        run: git diff --check
