name: Panel candidate preparation
on:
  pull_request:
  push:
    branches: [main, feat/panel-candidate-stage]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify candidate binding, private extraction and interrupted preparation
        run: sudo python3 -B -m unittest discover -s tests/unit -p test_panel_candidate.py -v
