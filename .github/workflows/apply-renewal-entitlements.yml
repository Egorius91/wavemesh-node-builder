name: Apply renewal entitlement patch

on:
  push:
    branches:
      - fix/renewal-node-entitlements

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/renewal-node-entitlements

      - name: Apply source patch
        run: python3 .github/renewal_patch.py

      - name: Compile Python sources
        run: python3 -m compileall -q agent tests/unit

      - name: Entitlement tests
        run: python3 -m unittest tests.unit.test_access_entitlements

      - name: Existing access runtime tests
        run: python3 -m unittest tests.unit.test_access_runtime tests.unit.test_node_agent

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-renewal-entitlements.yml .github/renewal_patch.py
          git add agent tests/unit
          git commit -m "feat(agent): update access entitlements without credential rotation"
          git push origin HEAD:fix/renewal-node-entitlements
