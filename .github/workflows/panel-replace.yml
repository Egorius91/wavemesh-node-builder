name: Panel file replacement
on:
  pull_request:
  push:
    branches: [main, feat/panel-file-replace]
permissions:
  contents: read
jobs:
  replace:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify real exchange, rollback, retained intent and startup denial
        run: sudo python3 -B -m unittest discover -s tests/unit -p test_panel_replace.py -v
