name: Shell quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify ShellCheck is available
        run: shellcheck --version

      - name: ShellCheck error-level findings
        run: |
          find bin agent scripts tests -type f -name '*.sh' -print0 \
            | xargs -0 shellcheck --severity=error

      - name: Patch hygiene
        run: git diff --check
